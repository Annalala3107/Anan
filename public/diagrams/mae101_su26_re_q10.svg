<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-labelledby="mae10-title mae10-desc">
  <title id="mae10-title">Đồ thị hàm số f(x) trên đoạn [0, 8] và tổng Riemann phải R_8</title>
  <desc id="mae10-desc">Hệ trục tọa độ Oxy với đồ thị hàm số y = f(x) đi qua các điểm (0,0), (1,1), (2,2), (3,1), (4,3), (5,2), (6,4), (7,5), (8,7) cùng 8 hình chữ nhật tổng Riemann phải.</desc>

  <defs>
    <style>
      .bg-card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; }
      .grid-line { stroke: #f1f5f9; stroke-width: 1.2; }
      .axis { stroke: #334155; stroke-width: 2.4; stroke-linecap: round; }
      .axis-tick { stroke: #64748b; stroke-width: 1.5; }
      .axis-label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #475569; text-anchor: middle; dominant-baseline: central; }
      .axis-name { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 800; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .rect-riemann { fill: #6366f1; fill-opacity: 0.16; stroke: #6366f1; stroke-width: 1.8; stroke-dasharray: 4 2; }
      .curve { fill: none; stroke: #0f172a; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .point { fill: #ef4444; stroke: #ffffff; stroke-width: 2; }
      .right-point { fill: #4f46e5; stroke: #ffffff; stroke-width: 2; }
      .tag-box { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .tag-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #475569; text-anchor: middle; dominant-baseline: central; }
      .legend-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="678" height="438" rx="16" class="bg-card" />

  <!-- Corner Tag -->
  <rect x="478" y="16" width="182" height="24" rx="8" class="tag-box" />
  <text x="569" y="28" class="tag-text">MAE101 • RIEMANN SUM R_8</text>

  <!-- Legend -->
  <g id="legend" transform="translate(100, 20)">
    <line x1="0" y1="8" x2="28" y2="8" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <text x="36" y="8" class="legend-text">Đường cong y = f(x)</text>

    <rect x="180" y="0" width="16" height="16" rx="3" class="rect-riemann" />
    <text x="204" y="8" class="legend-text">8 hình chữ nhật R_8 (Δx = 1)</text>
  </g>

  <!-- Coordinate Grid: x ∈ [0..8], y ∈ [0..8] (Origin at 90, 380; dx=60, dy=40) -->
  <g id="grid">
    <!-- Horizontal Grid Lines y=1..8 -->
    <line x1="90" y1="340" x2="570" y2="340" class="grid-line" />
    <line x1="90" y1="300" x2="570" y2="300" class="grid-line" />
    <line x1="90" y1="260" x2="570" y2="260" class="grid-line" />
    <line x1="90" y1="220" x2="570" y2="220" class="grid-line" />
    <line x1="90" y1="180" x2="570" y2="180" class="grid-line" />
    <line x1="90" y1="140" x2="570" y2="140" class="grid-line" />
    <line x1="90" y1="100" x2="570" y2="100" class="grid-line" />
    <line x1="90" y1="60" x2="570" y2="60" class="grid-line" />

    <!-- Vertical Grid Lines x=1..8 -->
    <line x1="150" y1="60" x2="150" y2="380" class="grid-line" />
    <line x1="210" y1="60" x2="210" y2="380" class="grid-line" />
    <line x1="270" y1="60" x2="270" y2="380" class="grid-line" />
    <line x1="330" y1="60" x2="330" y2="380" class="grid-line" />
    <line x1="390" y1="60" x2="390" y2="380" class="grid-line" />
    <line x1="450" y1="60" x2="450" y2="380" class="grid-line" />
    <line x1="510" y1="60" x2="510" y2="380" class="grid-line" />
    <line x1="570" y1="60" x2="570" y2="380" class="grid-line" />
  </g>

  <!-- Right Riemann Sum Rectangles R_8 -->
  <g id="riemann-rectangles">
    <!-- Subinterval [0, 1]: height f(1)=1 => y=340 -->
    <rect x="90" y="340" width="60" height="40" class="rect-riemann" />
    <!-- Subinterval [1, 2]: height f(2)=2 => y=300 -->
    <rect x="150" y="300" width="60" height="80" class="rect-riemann" />
    <!-- Subinterval [2, 3]: height f(3)=1 => y=340 -->
    <rect x="210" y="340" width="60" height="40" class="rect-riemann" />
    <!-- Subinterval [3, 4]: height f(4)=3 => y=260 -->
    <rect x="270" y="260" width="60" height="120" class="rect-riemann" />
    <!-- Subinterval [4, 5]: height f(5)=2 => y=300 -->
    <rect x="330" y="300" width="60" height="80" class="rect-riemann" />
    <!-- Subinterval [5, 6]: height f(6)=4 => y=220 -->
    <rect x="390" y="220" width="60" height="160" class="rect-riemann" />
    <!-- Subinterval [6, 7]: height f(7)=5 => y=180 -->
    <rect x="450" y="180" width="60" height="200" class="rect-riemann" />
    <!-- Subinterval [7, 8]: height f(8)=7 => y=100 -->
    <rect x="510" y="100" width="60" height="280" class="rect-riemann" />
  </g>

  <!-- Axes -->
  <g id="axes">
    <!-- X Axis -->
    <line x1="60" y1="380" x2="610" y2="380" class="axis" />
    <polyline points="602,374 614,380 602,386" fill="none" stroke="#334155" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="626" y="380" class="axis-name">x</text>

    <!-- Y Axis -->
    <line x1="90" y1="400" x2="90" y2="44" class="axis" />
    <polyline points="84,54 90,42 96,54" fill="none" stroke="#334155" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="90" y="28" class="axis-name">y</text>

    <!-- Origin 0 -->
    <text x="74" y="394" class="axis-label">0</text>

    <!-- X Ticks & Labels 1..8 -->
    <line x1="150" y1="380" x2="150" y2="386" class="axis-tick" /><text x="150" y="400" class="axis-label">1</text>
    <line x1="210" y1="380" x2="210" y2="386" class="axis-tick" /><text x="210" y="400" class="axis-label">2</text>
    <line x1="270" y1="380" x2="270" y2="386" class="axis-tick" /><text x="270" y="400" class="axis-label">3</text>
    <line x1="330" y1="380" x2="330" y2="386" class="axis-tick" /><text x="330" y="400" class="axis-label">4</text>
    <line x1="390" y1="380" x2="390" y2="386" class="axis-tick" /><text x="390" y="400" class="axis-label">5</text>
    <line x1="450" y1="380" x2="450" y2="386" class="axis-tick" /><text x="450" y="400" class="axis-label">6</text>
    <line x1="510" y1="380" x2="510" y2="386" class="axis-tick" /><text x="510" y="400" class="axis-label">7</text>
    <line x1="570" y1="380" x2="570" y2="386" class="axis-tick" /><text x="570" y="400" class="axis-label">8</text>

    <!-- Y Ticks & Labels 1..8 -->
    <line x1="84" y1="340" x2="90" y2="340" class="axis-tick" /><text x="72" y="340" class="axis-label">1</text>
    <line x1="84" y1="300" x2="90" y2="300" class="axis-tick" /><text x="72" y="300" class="axis-label">2</text>
    <line x1="84" y1="260" x2="90" y2="260" class="axis-tick" /><text x="72" y="260" class="axis-label">3</text>
    <line x1="84" y1="220" x2="90" y2="220" class="axis-tick" /><text x="72" y="220" class="axis-label">4</text>
    <line x1="84" y1="180" x2="90" y2="180" class="axis-tick" /><text x="72" y="180" class="axis-label">5</text>
    <line x1="84" y1="140" x2="90" y2="140" class="axis-tick" /><text x="72" y="140" class="axis-label">6</text>
    <line x1="84" y1="100" x2="90" y2="100" class="axis-tick" /><text x="72" y="100" class="axis-label">7</text>
    <line x1="84" y1="60" x2="90" y2="60" class="axis-tick" /><text x="72" y="60" class="axis-label">8</text>
  </g>

  <!-- Continuous Curve f(x) -->
  <path d="M 90 380 Q 120 355 150 340 Q 180 320 210 300 Q 240 310 270 340 Q 300 300 330 260 Q 360 280 390 300 Q 420 260 450 220 Q 480 200 510 180 Q 540 140 570 100" class="curve" />

  <!-- Data Points (Right Endpoints highlighted with purple, origin with red) -->
  <circle cx="90" cy="380" r="4.5" class="point" />
  <circle cx="150" cy="340" r="5" class="right-point" />
  <circle cx="210" cy="300" r="5" class="right-point" />
  <circle cx="270" cy="340" r="5" class="right-point" />
  <circle cx="330" cy="260" r="5" class="right-point" />
  <circle cx="390" cy="300" r="5" class="right-point" />
  <circle cx="450" cy="220" r="5" class="right-point" />
  <circle cx="510" cy="180" r="5" class="right-point" />
  <circle cx="570" cy="100" r="5" class="right-point" />
</svg>
