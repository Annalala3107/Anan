<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img" aria-labelledby="cea311-title cea311-desc">
  <title id="cea311-title">Khuôn dạng lệnh 16-bit IAS (Instruction Format)</title>
  <desc id="cea311-desc">Sơ đồ khuôn dạng lệnh 16-bit chia thành hai trường: Bits 0–3 là Opcode (4 bits) và Bits 4–15 là Address (12 bits).</desc>

  <defs>
    <style>
      .bg-card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; }
      .grid-dot { fill: #e2e8f0; }
      .tag-box { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .tag-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #475569; text-anchor: middle; dominant-baseline: central; }
      .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 800; fill: #0f172a; }
      .header-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
      .field-opcode { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
      .field-address { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .field-name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
      .field-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .bit-index { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #475569; text-anchor: middle; dominant-baseline: central; }
      .dimension-line { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 3 3; }
      .dimension-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #475569; text-anchor: middle; dominant-baseline: central; }
    </style>

    <pattern id="subtle-grid-311" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.9" class="grid-dot" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="678" height="258" rx="16" class="bg-card" />
  <rect x="8" y="8" width="664" height="244" rx="12" fill="url(#subtle-grid-311)" opacity="0.7" />

  <!-- Corner Tag -->
  <rect x="496" y="16" width="164" height="24" rx="8" class="tag-box" />
  <text x="578" y="28" class="tag-text">CEA201 • IAS / ISA FORMAT</text>

  <!-- Section Title -->
  <text x="32" y="36" class="header-title">16-bit Instruction Register Format</text>
  <text x="32" y="54" class="header-sub">Khuôn dạng phân rã các trường bit trong một lệnh thực thi của bộ xử lý</text>

  <!-- Bit Indices Above Register -->
  <g id="bit-indices-top">
    <!-- Opcode Bits 0..3 -->
    <text x="44" y="82" class="bit-index">0</text>
    <text x="180" y="82" class="bit-index">3</text>

    <!-- Address Bits 4..15 -->
    <text x="210" y="82" class="bit-index">4</text>
    <text x="636" y="82" class="bit-index">15</text>
  </g>

  <!-- Main Register Box (Total Width: 608px; Opcode: 152px, Address: 456px) -->
  <g id="register-fields">
    <!-- Opcode Field (Bits 0-3) -->
    <rect x="36" y="94" width="156" height="76" rx="8" class="field-opcode" />
    <text x="114" y="124" class="field-name" fill="#3730a3">OPCODE</text>
    <text x="114" y="146" class="field-sub" fill="#6366f1">Operation Code (4 bits)</text>

    <!-- Address Field (Bits 4-15) -->
    <rect x="200" y="94" width="444" height="76" rx="8" class="field-address" />
    <text x="422" y="124" class="field-name" fill="#15803d">ADDRESS</text>
    <text x="422" y="146" class="field-sub" fill="#16a34a">Memory / Operand Address (12 bits: 4–15)</text>
  </g>

  <!-- Dimension Markers Below Register -->
  <g id="dimension-lines">
    <!-- Opcode Width Bracket -->
    <line x1="36" y1="184" x2="36" y2="198" class="dimension-line" />
    <line x1="192" y1="184" x2="192" y2="198" class="dimension-line" />
    <line x1="36" y1="194" x2="192" y2="194" stroke="#6366f1" stroke-width="1.6" />
    <rect x="88" y="184" width="52" height="20" rx="6" fill="#ffffff" stroke="#c7d2fe" />
    <text x="114" y="194" class="dimension-text" fill="#4338ca">4 BITS</text>

    <!-- Address Width Bracket -->
    <line x1="200" y1="184" x2="200" y2="198" class="dimension-line" />
    <line x1="644" y1="184" x2="644" y2="198" class="dimension-line" />
    <line x1="200" y1="194" x2="644" y2="194" stroke="#16a34a" stroke-width="1.6" />
    <rect x="396" y="184" width="56" height="20" rx="6" fill="#ffffff" stroke="#bbf7d0" />
    <text x="424" y="194" class="dimension-text" fill="#15803d">12 BITS</text>
  </g>

  <!-- Total Width Label -->
  <text x="340" y="234" class="dimension-text" fill="#64748b">Total Word Length: 16 bits (0 to 15)</text>
</svg>
